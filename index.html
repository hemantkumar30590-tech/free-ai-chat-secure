<script>
const msgs=document.getElementById('messages');
const inp=document.getElementById('input');
async function send(){
  const text=inp.value.trim();
  if(!text) return;
  addMsg(text,'user');
  inp.value='';
  const thinking=document.createElement('div');
  thinking.className='msg ai'; thinking.id='thinking'; thinking.innerHTML='●●● Thinking...';
  msgs.appendChild(thinking); msgs.scrollTop=msgs.scrollHeight;
  try{
    const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(text));
    let reply=await res.text();
    if(!reply||reply.length<2) reply="I'm here to help! You asked: '"+text+"' — I can help with coding, writing, ideas and more.";
    document.getElementById('thinking').remove();
    addMsg(reply,'ai');
  }catch(e){
    document.getElementById('thinking').remove();
    addMsg("⚠️ AI busy, try again. Question: "+text,'ai');
  }
}
function addMsg(t,role){
  const d=document.createElement('div'); d.className='msg '+role;
  let html=t.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html=html.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\n/g,'<br>');
  d.innerHTML=html; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
</script>
