<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--card:#151a2d;--border:rgba(255,255,255,0.08);--primary:#7c3aed;--primary2:#ec4899;--text:#f1f5f9;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:radial-gradient(1200px at 10% -10%, #1e1b4b 0%, transparent 60%),radial-gradient(1000px at 90% 10%, #4c1d95 0%, transparent 50%),var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.ad-top{position:sticky;top:0;z-index:9999;background:rgba(10,14,26,0.95);backdrop-filter:blur(12px);text-align:center;padding:6px 0;border-bottom:1px solid var(--border);min-height:60px;display:flex;align-items:center;justify-content:center}
.header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(21,26,45,0.6);backdrop-filter:blur(12px)}
.logo{font-weight:700;font-size:1.3rem;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:11px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;padding:4px 10px;border-radius:20px}
.main{display:flex;flex:1;max-width:1400px;width:100%;margin:0 auto;gap:16px;padding:16px}
.chat-wrap{flex:1;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;min-height:70vh}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;padding:14px 18px;border-radius:18px;line-height:1.6;font-size:14.5px;animation:fadeIn.3s ease;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.ai pre{background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;margin:8px 0;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px}
.input-area{padding:16px;border-top:1px solid var(--border);background:rgba(0,0,0,0.2)}
.file-preview{font-size:12px;color:#a78bfa;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.file-preview span{background:rgba(124,58,237,0.2);padding:4px 10px;border-radius:20px}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:white;padding:14px 18px;border-radius:12px;outline:none;font-size:15px}
.icon-btn{background:rgba(255,255,255,0.08);border:1px solid var(--border);color:white;width:48px;border-radius:12px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.send-btn{background:linear-gradient(135deg,var(--primary),var(--primary2));border:none;color:white;padding:0 24px;border-radius:12px;font-weight:600;cursor:pointer}
.sidebar{width:320px;display:flex;flex-direction:column;gap:16px}
.history-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;max-height:320px;overflow-y:auto}
.history-title{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.history-item{font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd5e1}
.history-item:hover{background:rgba(124,58,237,0.15);color:white}
.ad-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:100px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.main{flex-direction:column}.sidebar{width:100%;order:-1}.msg{max-width:92%}}
</style>
</head>
<body>
<div class="ad-top">
<script>atOptions={'key':'4b3f45b67a6e7d12a006c8eb52a838ec','format':'iframe','height':50,'width':320,'params':{}};</script>
<script src="https://www.highperformanceformat.com/4b3f45b67a6e7d12a006c8eb52a838ec/invoke.js"></script>
</div>
<div class="header">
<div class="logo">⚡ Free AI Chat MOE</div>
<div class="badge">● SECURE • FREE • NO LOGIN</div>
</div>
<div class="main">
<div class="chat-wrap">
<div class="messages" id="messages">
<div class="msg ai">👋 Hi! Now upload Image / PDF / Docx and ask about it! 🚀</div>
</div>
<div class="input-area">
<div class="file-preview" id="filePreview" style="display:none"><span id="fileName"></span> <a href="#" onclick="clearFile()" style="color:#f472b6;text-decoration:none">✕ Remove</a></div>
<div class="input-row">
<input type="file" id="fileInput" accept=".pdf,.txt,.docx,.doc,image/*" style="display:none">
<button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
<input id="input" placeholder="Ask anything or upload file..." onkeypress="if(event.key==='Enter')send()">
<button class="send-btn" onclick="send()">Send →</button>
</div>
</div>
</div>
<div class="sidebar">
<div class="history-box">
<div class="history-title"><span>🕒 Chat History</span><span style="cursor:pointer" onclick="clearHistory()">Clear</span></div>
<div id="historyList" style="font-size:12px;color:var(--muted)">No history yet</div>
</div>
<div class="ad-box"><script async data-cfasync="false" src="https://pl30920346.effectivecpmnetwork.com/69b61fb283446181fb63b1d2f38838ce/invoke.js"></script><div id="container-69b61fb283446181fb63b1d2f38838ce"></div></div>
<div class="ad-box"><script>atOptions={'key':'fb4ee13272c34e570882781e1566a383','format':'iframe','height':250,'width':300,'params':{}};</script><script src="https://www.highperformanceformat.com/fb4ee13272c34e570882781e1566a383/invoke.js"></script></div>
</div>
</div>
<script>
const msgs=document.getElementById('messages');
const inp=document.getElementById('input');
const fileInput=document.getElementById('fileInput');
let selectedFile=null;
fileInput.addEventListener('change',(e)=>{if(e.target.files[0]){selectedFile=e.target.files[0];document.getElementById('filePreview').style.display='flex';document.getElementById('fileName').innerText='📄 '+selectedFile.name;}});
function clearFile(){selectedFile=null;fileInput.value='';document.getElementById('filePreview').style.display='none';}
async function send(){
  const text=inp.value.trim();
  if(!text &&!selectedFile) return;
  let displayText=text; if(selectedFile) displayText+='\n📎 ['+selectedFile.name+']';
  addMsg(displayText,'user');
  if(text) saveHistory(text);
  inp.value='';
  const thinking=document.createElement('div'); thinking.className='msg ai'; thinking.id='thinking'; thinking.innerHTML='●●● Thinking...'; msgs.appendChild(thinking); msgs.scrollTop=msgs.scrollHeight;
  try{
    let res;
    if(selectedFile){
      const formData=new FormData(); formData.append('file',selectedFile); formData.append('message',text);
      res=await fetch('/api/chat',{method:'POST',body:formData}); clearFile();
    } else {
      res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    }
    const data=await res.json(); document.getElementById('thinking').remove(); addMsg(data.reply||'No reply','ai');
  }catch(e){document.getElementById('thinking').remove(); addMsg('⚠️ Error: '+e.message,'ai');}
}
function addMsg(t,role){const d=document.createElement('div'); d.className='msg '+role; let html=t.replace(/</g,'&lt;').replace(/>/g,'&gt;'); html=html.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\n/g,'<br>'); d.innerHTML=html; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;}
function saveHistory(q){let h=JSON.parse(localStorage.getItem('moe_history')||'[]'); h.unshift({q,time:new Date().toLocaleString()}); if(h.length>50)h=h.slice(0,50); localStorage.setItem('moe_history',JSON.stringify(h)); renderHistory();}
function renderHistory(){let h=JSON.parse(localStorage.getItem('moe_history')||'[]'); const list=document.getElementById('historyList'); if(h.length===0){list.innerHTML='No history yet';return;} list.innerHTML=h.map(x=>`<div class="history-item" onclick="setInput('${x.q.replace(/'/g,"\\'")}')">${x.q.substring(0,40)}</div>`).join('');}
function setInput(q){document.getElementById('input').value=q; document.getElementById('input').focus();}
function clearHistory(){localStorage.removeItem('moe_history'); renderHistory();}
renderHistory();
</script>
</body>
</html>
