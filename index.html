<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOE AI - Groq MOE Super Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#0a0a0b;color:#ececec;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 16px;background:#121214;border-bottom:1px solid #232326;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.logo span{background:linear-gradient(135deg,#a855f7,#ec4899);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.badge{font-size:11px;background:#1a1a1e;border:1px solid #2a2a30;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.welcome{background:linear-gradient(180deg,#15151a,#0f0f12);border:1px solid #232326;border-radius:16px;padding:20px;text-align:center}
.welcome h2{font-size:18px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.chip{background:#1c1c20;border:1px solid #2a2a30;padding:8px;border-radius:10px;font-size:12px;color:#a1a1aa}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;line-height:1.6;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#1a1a1e;border:1px solid #26262b;border-bottom-left-radius:6px}
.model-tag{margin-top:8px;font-size:11px;color:#71717a;display:flex;align-items:center;gap:6px;background:#121214;padding:4px 8px;border-radius:20px;width:fit-content;border:1px solid #232326}
.inputBar{padding:12px;background:#121214;border-top:1px solid #232326;display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0}
#inp{flex:1;background:#0a0a0b;border:1px solid #2a2a30;color:#fff;padding:12px 16px;border-radius:24px;outline:none;resize:none;max-height:120px;font-size:14px}
#inp:focus{border-color:#a855f7}
#send{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#000;font-size:18px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.typing{opacity:.6;font-style:italic}
</style>
</head>
<body>
<div class="header">
<div class="logo"><span>🧠</span> MOE AI</div>
<div class="badge"><div class="dot"></div><span id="modelName">Groq MOE • Auto</span></div>
</div>

<div id="chat">
<div class="welcome">
<h2>🚀 MOE AI - Groq Super MOE Ready!</h2>
<p style="font-size:13px;color:#a1a1aa;margin-top:4px">7 Experts • Live Search • Auto Fallback • Secure</p>
<div class="grid">
<div class="chip">⚡ Fast • Llama 3.1 8B</div>
<div class="chip">🧠 Smart • Llama 3.3 70B</div>
<div class="chip">💻 Coder • Qwen 32B</div>
<div class="chip">🔢 Math • DeepSeek R1</div>
<div class="chip">👁️ Llama 4 • Maverick</div>
<div class="chip">🤖 GPT-OSS • 120B</div>
</div>
</div>
</div>

<div class="inputBar">
<textarea id="inp" rows="1" placeholder="Ask anything... (Hindi/English)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button id="send" onclick="send()">↑</button>
</div>

<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), modelName=document.getElementById('modelName');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'});
async function send(){
 const text=inp.value.trim(); if(!text)return;
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 inp.value=''; inp.style.height='auto'; chat.scrollTop=chat.scrollHeight;
 const bot=document.createElement('div'); bot.className='msg bot typing'; bot.textContent='MOE Experts soch rahe hain...';
 chat.appendChild(bot); chat.scrollTop=chat.scrollHeight;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  modelName.textContent=j.model;
  bot.classList.remove('typing');
  bot.innerHTML=`${j.reply.replace(/\n/g,'<br>')}<div class="model-tag">🤖 ${j.model} • Secure Backend</div>`;
 }catch(e){
  bot.classList.remove('typing');
  bot.innerHTML=`❌ Error: ${e.message}<div class="model-tag">Check Render Env Vars (GROQ_API_KEY)</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
