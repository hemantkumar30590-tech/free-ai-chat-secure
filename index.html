  typing.remove();
  const ans=data.choices?.[0]?.message?.content || data.error || 'No response';
  addMsg('ai',ans);
 }catch(e){typing.remove();addMsg('ai','Error: '+e.message+'\nNote: Ye secure version Vercel pe hi chalega, Acode preview me nahi. Acode ke liye single file wala use karo.');}
}
