<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Chat - MOE Secure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui; display:flex; flex-direction:column; height:100vh;}
.header{padding:15px; background:#11111a; border-bottom:1px solid #222; text-align:center; font-weight:bold;}
#chat{flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px;}
.msg{padding:12px 16px; border-radius:18px; max-width:85%; line-height:1.5; word-wrap:break-word;}
.user{background:linear-gradient(135deg,#a855f7,#ec4899); align-self:flex-end; border-bottom-right-radius:4px;}
.bot{background:#1e1e2a; align-self:flex-start; border-bottom-left-radius:4px; border:1px solid #2a2a3a;}
.input-area{padding:12px; background:#11111a; display:flex; gap:10px; border-top:1px solid #222;}
#inp{flex:1; background:#1e1e2a; border:1px solid #333; color:#fff; padding:12px 18px; border-radius:25px; outline:none;}
#send{background:linear-gradient(135deg,#a855f7,#ec4899); border:none; width:48px; height:48px; border-radius:50%; color:#fff; font-size:20px; cursor:pointer;}
small{opacity:0.6; font-size:12px;}
</style>
</head>
<body>
<div class="header">💬 Free AI Chat - MOE Secure (Render)</div>
<div id="chat">
<div class="msg bot">
🧠 <b>Free AI Chat MOE Ready!</b><br><br>
✅ API Keys backend me hidden hai (Render Vars)<br>
✅ User ko sirf chatbox dikhega<br>
✅ Latest data ON (Serper + Groq)<br><br>
Pucho kuch bhi!
</div>
</div>
<div class="input-area">
<input id="inp" placeholder="Pucho kuch bhi - latest data ke saath..." onkeypress="if(event.key==='Enter')send()">
<button id="send" onclick="send()">↗</button>
</div>
<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
async function send(){
  const text = inp.value.trim();
  if(!text) return;
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  inp.value = '';
  chat.scrollTop = chat.scrollHeight;
  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  botDiv.innerHTML = 'Soch raha hu...';
  chat.appendChild(botDiv);
  chat.scrollTop = chat.scrollHeight;
  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    botDiv.innerHTML = (data.reply || 'Koi reply nahi aaya').replace(/\n/g,'<br>');
  }catch(e){
    botDiv.innerHTML = 'Error: ' + e.message;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
